# UniBook Database Configuration
# Connects to MySQL by default, with automatic graceful fallback to H2 in-memory MySQL mode
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/unibook_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# Fallback In-Memory Config (Used when standalone MySQL server is unreachable)
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:unibook_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
db.fallback.user=sa
db.fallback.password=
